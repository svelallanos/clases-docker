services:
  web:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./html:/usr/share/nginx/html

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: samiza_db
      MYSQL_USER: samiza
      MYSQL_PASSWORD: samiza123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  
volumes:
  mysql_data: